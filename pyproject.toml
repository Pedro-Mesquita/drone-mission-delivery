[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mission-delivery"
version = "0.1.0"
description = "Missão: navegar até um destino desviando de obstáculos no chão e soltar um objeto"
requires-python = ">=3.10"
dependencies = [
    "drone-mission-core @ git+ssh://git@github.com/puc-aerorio/drone-mission-core.git@develop",
    "drone-vision-core @ git+ssh://git@github.com/puc-aerorio/drone-vision-core.git@develop",
]

[project.optional-dependencies]
dev = ["mypy>=1.10", "pytest>=8.0", "ruff>=0.5"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/mission_delivery"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
